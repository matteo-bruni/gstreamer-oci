name: Manual Container Release

on:
  workflow_dispatch:
    inputs:
      gstreamer_version:
        description: Numeric GStreamer release tag to build
        required: true
        default: "1.28.8"
        type: string
      release_revision:
        description: Distribution revision (1 has no suffix; 2 produces -r2)
        required: true
        default: "1"
        type: string
      python_versions:
        description: Space-separated list of Python versions, for example "3.12 3.14"
        required: true
        default: "3.12"
        type: string
      base_image:
        description: Base image repository
        required: true
        default: "ubuntu"
        type: string
      base_tag:
        description: Ubuntu versions to build
        required: true
        default: both
        type: choice
        options:
          - both
          - "24.04"
          - "26.04"
      variant:
        description: Optional codec/driver variant (independent of the base profile)
        required: true
        default: free
        type: choice
        options:
          - free
          - non-free
      image_target:
        description: runtime = execution image; dev = compilers, headers and sources
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - dev
      build_type:
        description: Meson/Docker build type. release = distributable build, debug = debug symbols and +debug wheel suffix, debugoptimized = optimized debug build
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - debugoptimized
      uv_version:
        description: uv image tag
        required: true
        default: "0.13.5"
        type: string
      release_tag:
        description: Optional Git tag. Both Ubuntu versions append -ubuntu-24.04/-ubuntu-26.04; empty generates the full tag.
        required: false
        default: ""
        type: string
      release_name:
        description: Optional release title. Both Ubuntu versions append the Ubuntu version; empty generates the title.
        required: false
        default: ""
        type: string
      environment_name:
        description: GitHub Environment name for approvals, protected secrets, and deployment rules. Usually keep `release`
        required: true
        default: "release"
        type: string
      dry_run:
        description: Build and prepare release assets without pushing images or publishing the GitHub Release
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean
      release_notes:
        description: Extra release notes appended to the generated summary
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  # Serialize both/single-Ubuntu runs that can update the same aliases.
  group: manual-release-${{ inputs.gstreamer_version }}-${{ inputs.base_image }}-${{ inputs.variant }}-${{ inputs.image_target }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  release:
    name: Ubuntu ${{ matrix.base_tag }} — build and release
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        base_tag: ${{ fromJSON(inputs.base_tag == 'both' && '["24.04","26.04"]' || format('["{0}"]', inputs.base_tag)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    environment: ${{ inputs.environment_name }}
    env:
      GSTREAMER_VERSION: ${{ inputs.gstreamer_version }}
      RELEASE_REVISION: ${{ inputs.release_revision }}
      PYTHON_VERSIONS: ${{ inputs.python_versions }}
      BASE_IMAGE: ${{ inputs.base_image }}
      BASE_TAG: ${{ matrix.base_tag }}
      GSTREAMER_BUILD_PROFILE: base
      VARIANT: ${{ inputs.variant }}
      IMAGE_TARGET: ${{ inputs.image_target }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_JOBS: "2"
      UV_VERSION: ${{ inputs.uv_version }}
      GHCR_IMAGE_NAME: gstreamer
      CUSTOM_RELEASE_TAG: ${{ inputs.base_tag == 'both' && inputs.release_tag != '' && format('{0}-ubuntu-{1}', inputs.release_tag, matrix.base_tag) || inputs.release_tag }}
      CUSTOM_RELEASE_NAME: ${{ inputs.base_tag == 'both' && inputs.release_name != '' && format('{0} (Ubuntu {1})', inputs.release_name, matrix.base_tag) || inputs.release_name }}
      DRY_RUN: ${{ inputs.dry_run }}
      PRERELEASE: ${{ inputs.prerelease }}
      EXTRA_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install just and jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just jq

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify all variants, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh

      - name: Upload prepared release assets
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-release-assets-ubuntu-${{ matrix.base_tag }}-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
