name: Manual Container Release

on:
  workflow_dispatch:
    inputs:
      gstreamer_version:
        description: Numeric GStreamer release tag to build
        required: true
        default: "1.28.8"
        type: string
      python_versions:
        description: Space-separated list of Python versions, for example "3.12 3.14"
        required: true
        default: "3.12"
        type: string
      base_image:
        description: Base image repository
        required: true
        default: "ubuntu"
        type: string
      base_tag:
        description: Base image tag
        required: true
        default: "24.04"
        type: string
      variant:
        description: Optional codec/driver variant (independent of the base profile)
        required: true
        default: free
        type: choice
        options:
          - free
          - non-free
      image_target:
        description: runtime = execution image; dev = compilers, headers and sources
        required: true
        default: runtime
        type: choice
        options:
          - runtime
          - dev
      build_type:
        description: Meson/Docker build type. release = distributable build, debug = debug symbols and +debug wheel suffix, debugoptimized = optimized debug build
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - debugoptimized
      uv_version:
        description: uv image tag
        required: true
        default: "0.13.5"
        type: string
      release_tag:
        description: Optional Git tag for the GitHub Release. Leave empty to auto-generate it.
        required: false
        default: ""
        type: string
      release_name:
        description: Optional GitHub Release title. Leave empty to auto-generate it.
        required: false
        default: ""
        type: string
      environment_name:
        description: GitHub Environment name for approvals, protected secrets, and deployment rules. Usually keep `release`
        required: true
        default: "release"
        type: string
      dry_run:
        description: Build and prepare release assets without pushing images or publishing the GitHub Release
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean
      release_notes:
        description: Extra release notes appended to the generated summary
        required: false
        default: ""
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: manual-release-${{ inputs.release_tag != '' && inputs.release_tag || format('gst-python-binding-{0}-{1}-{2}-{3}{4}{5}{6}', inputs.gstreamer_version, inputs.base_image, inputs.base_tag, 'base', inputs.build_type != 'release' && format('-{0}', inputs.build_type) || '', inputs.image_target == 'dev' && '-dev' || '', inputs.variant == 'non-free' && '-non-free' || '') }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish, and release
    runs-on: ubuntu-latest
    timeout-minutes: 480
    environment: ${{ inputs.environment_name }}
    env:
      GSTREAMER_VERSION: ${{ inputs.gstreamer_version }}
      PYTHON_VERSIONS: ${{ inputs.python_versions }}
      BASE_IMAGE: ${{ inputs.base_image }}
      BASE_TAG: ${{ inputs.base_tag }}
      GSTREAMER_BUILD_PROFILE: base
      VARIANT: ${{ inputs.variant }}
      IMAGE_TARGET: ${{ inputs.image_target }}
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_JOBS: "2"
      UV_VERSION: ${{ inputs.uv_version }}
      GHCR_IMAGE_NAME: gstreamer
      CUSTOM_RELEASE_TAG: ${{ inputs.release_tag }}
      CUSTOM_RELEASE_NAME: ${{ inputs.release_name }}
      DRY_RUN: ${{ inputs.dry_run }}
      PRERELEASE: ${{ inputs.prerelease }}
      EXTRA_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install just and jq
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends just jq

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify all variants, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh

      - name: Upload prepared release assets
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manual-release-assets-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
